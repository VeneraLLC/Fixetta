function guessCategory(file) {
  const n = file.name.toLowerCase();
  if (n.includes("faucet") || n.includes("sink") || n.includes("pipe") || n.includes("water") || n.includes("plumb")) return "plumbing";
  if (n.includes("wall") || n.includes("drywall") || n.includes("hole") || n.includes("crack")) return "drywall";
  if (n.includes("furniture") || n.includes("ikea") || n.includes("chair") || n.includes("desk") || n.includes("shelf")) return "furniture";
  if (n.includes("electric") || n.includes("outlet") || n.includes("wire") || n.includes("switch")) return "electrical";
  if (n.includes("box") || n.includes("moving") || n.includes("pack")) return "moving";
  if (n.includes("paint") || n.includes("room") || n.includes("color")) return "painting";
  if (n.includes("roof") || n.includes("shingle") || n.includes("gutter")) return "roof";
  return "default";
}

function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }, []);
  return <div className="toast">{msg}</div>;
}

    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreview(url);
    setPhoto(url);
    setTimeout(() => startAnalysis(file), 400);

    setAnalyzing(true);

      p += Math.random() * 18 + 6;

            <button className="btn btn-primary" onClick={() => navigate("camera")}><Icon name="camera" size={16} color="white"/> Snap AI</button>
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {filtered.map(p => (
              <div key={p.id} className="card" style={{overflow:"hidden",cursor:"pointer"}}>
                <div style={{height:100,background:`linear-gradient(135deg,var(--teal-xl),var(--teal-l))`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:52,position:"relative"}}>
                  {p.emoji}
                  <div style={{position:"absolute",top:10,right:10}}>
                    <span className={`badge ${p.status==="Completed"?"badge-green":p.status==="In Progress"?"badge-orange":"badge-gray"}`}>{p.status}</span>
                  </div>
                </div>
                <div style={{padding:"16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div style={{fontFamily:"Syne",fontSize:16,fontWeight:700,flex:1}}>{p.title}</div>
                    <div style={{fontFamily:"Syne",fontSize:16,fontWeight:800,color:"var(--teal)",marginLeft:12}}>{p.cost}</div>
                  </div>
                  <div style={{display:"flex",gap:12,fontSize:12,color:"var(--gray)"}}>
                    <span>👷 {p.pro}</span>
                    <span>📅 {p.date}</span>
                  </div>
                  {p.status === "In Progress" && (
                    <div style={{marginTop:12}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:600,marginBottom:6}}>
                        <span style={{color:"var(--gray)"}}>Progress</span>
                        <span style={{color:"var(--teal)"}}>65%</span>
                      </div>
                      <div className="progress-bar">
                        <div className="progress-fill" style={{width:"65%",background:"linear-gradient(90deg,var(--teal),#6ee7b7)"}}/>
                      </div>
                    </div>
                  )}
                  {p.status === "Completed" && (
                    <div style={{marginTop:10,display:"flex",gap:8}}>
                      <button className="btn btn-ghost" style={{flex:1,padding:"9px",fontSize:13,borderRadius:10}}>⭐ Leave Review</button>
                      <button className="btn btn-primary" style={{flex:1,padding:"9px",fontSize:13,borderRadius:10}} onClick={() => navigate("camera")}>Rebook</button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* SNAP CTA */}
        <div style={{marginTop:16,background:"linear-gradient(135deg,var(--teal),var(--teal-d))",borderRadius:16,padding:"20px",textAlign:"center"}}>
          <div style={{fontFamily:"Syne",fontSize:16,fontWeight:800,color:"white",marginBottom:6}}>Got a new problem?</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,.8)",marginBottom:14}}>Snap a photo and get an instant AI estimate</div>
          <button className="btn btn-orange" onClick={() => navigate("camera")} style={{padding:"11px 24px",fontSize:14}}>
            <Icon name="camera" size={16} color="white"/> Snap Now
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── APP SHELL ─────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState("home");
  const [analysis, setAnalysis] = useState(null);
  const [photo, setPhoto] = useState(null);
  const [toast, setToast] = useState(null);

  const navigate = (s) => setScreen(s);

  const navItems = [
    { id:"home", icon:"🏠", label:"Home" },
    { id:"projects", icon:"📁", label:"Projects" },
    { id:"camera", icon:null, label:"Snap" },
    { id:"pros", icon:"👷", label:"Pros" },
    { id:"profile", icon:"👤", label:"Profile" },
  ];

  return (
    <div style={{maxWidth:430,margin:"0 auto",position:"relative",background:"white",minHeight:"100vh",boxShadow:"0 0 60px rgba(0,0,0,.12)"}}>
      {toast && <Toast msg={toast} onDone={() => setToast(null)} />}

      {/* SCREEN RENDER */}
      {screen === "home" && <HomeScreen navigate={navigate} setAnalysis={setAnalysis} setPhoto={setPhoto} />}
      {screen === "camera" && <CameraScreen navigate={navigate} setAnalysis={setAnalysis} setPhoto={setPhoto} />}
      {screen === "result" && <ResultScreen navigate={navigate} analysis={analysis} photo={photo} />}
      {screen === "pros" && <ProsScreen navigate={navigate} analysis={analysis} />}
      {screen === "projects" && <ProjectsScreen navigate={navigate} />}
      {screen === "profile" && <ProfileScreen navigate={navigate} />}

      {/* BOTTOM NAV */}
      <div className="bottom-nav">
        {navItems.map(item => {
          if (item.id === "camera") {
            return (
              <div key="camera" className="bnav-item bnav-snap">
                <div className="bnav-snap-btn" onClick={() => navigate("camera")}>
                  <Icon name="camera" size={24} color="white"/>
                </div>
                <span style={{fontSize:10,fontWeight:700,color:"var(--teal)",marginTop:4}}>Snap</span>
              </div>
            );
          }
          const isActive = screen === item.id || (screen === "result" && item.id === "camera");
          return (
            <button key={item.id} className={`bnav-item ${isActive?"active":""}`} onClick={() => navigate(item.id)}>
              <span className="bnav-icon">{item.icon}</span>
              <span>{item.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
